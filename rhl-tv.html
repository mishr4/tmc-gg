<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHL now — Live</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://framerusercontent.com/images/olEbZxuoH5pKejdyaDSkL5i6QRA.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="https://framerusercontent.com/images/xXqMaDVEsTY7zCpnF1T55Dnaxlg.png" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0d1118; overflow: hidden; }
  body { font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }

  /* channel bug (watermark) */
  .bug { position: fixed; top: 22px; right: 26px; height: 26px; opacity: .82; pointer-events: none; z-index: 5;
         filter: drop-shadow(0 1px 4px rgba(0,0,0,.6)); }

  /* live chip — same vocabulary as /rhl */
  .livechip { position: fixed; top: 22px; left: 26px; z-index: 5; display: flex; align-items: center; gap: 8px;
              background: rgba(18,22,31,.72); padding: 6px 12px; border-radius: 2px; }
  .livechip .dot { width: 6px; height: 6px; border-radius: 269px; background: #fe0000; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 55% { opacity: .45; } }
  .livechip span { font-size: 13px; font-weight: 500; color: #fff; }

  /* unmute prompt — SUBSCRIBE-button styling */
  #unmute {
    position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); z-index: 6;
    background: #00bbfe; color: #000; border: 0; cursor: pointer; font-family: inherit;
    font-size: 11px; font-weight: 500; padding: 10px 22px; border-radius: 2px; display: none;
  }
  #unmute.show { display: block; }

  /* info bar */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; height: 52px;
    background: rgba(18,22,31,.86); display: flex; align-items: center; gap: 18px; padding: 0 26px;
    transition: opacity .35s; opacity: 0;
  }
  body:hover .bar, .bar.pin { opacity: 1; }
  .bar .now { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .next { font-size: 11px; font-weight: 500; color: rgba(255,255,255,.55); white-space: nowrap; }
  .bar .grow { flex: 1; }
  .bar button {
    background: none; border: 0; cursor: pointer; color: #fff; font-family: inherit;
    font-size: 11px; font-weight: 500; padding: 8px 10px;
  }
  .bar button:hover { color: #00bbfe; }

  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 4;
            color: rgba(255,255,255,.6); font-size: 13px; font-weight: 500; pointer-events: none; }
  #status:empty { display: none; }

  @media (prefers-reduced-motion: reduce) { .livechip .dot { animation: none; } }
</style>
</head>
<body>

<video id="tv" playsinline autoplay muted></video>
<img class="bug" id="bug" alt="" hidden>
<div class="livechip"><span class="dot"></span><span>Live</span></div>
<button id="unmute">TAP FOR SOUND</button>
<div id="status">Tuning in…</div>
<div class="bar" id="bar">
  <span class="now" id="now"></span>
  <span class="grow"></span>
  <span class="next" id="next"></span>
  <button id="fs">Fullscreen</button>
</div>

<script>
(function () {
  var tv = document.getElementById('tv'),
      nowEl = document.getElementById('now'),
      nextEl = document.getElementById('next'),
      statusEl = document.getElementById('status'),
      unmuteBtn = document.getElementById('unmute'),
      manifest = null, sequence = [], totalDur = 0, currentIndex = -1, dead = {};

  /* ---------- deterministic daily schedule ----------
     Every viewer computes the same sequence from the same seed
     (days since epoch, UTC) and the same wall-clock position,
     so everyone is watching the same "broadcast". */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1)), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }

  function daySeed() { return Math.floor(Date.now() / 86400000); }

  function buildSequence(seed) {
    var rng = mulberry32(seed);
    var programs = shuffle(manifest.programs.slice(), rng);
    var seq = [];
    programs.forEach(function (p) {
      seq.push(Object.assign({ kind: 'program' }, p));
      var ads = (manifest.structure && manifest.structure.commercialsPerBreak) || 2;
      for (var i = 0; i < ads; i++) {
        if (manifest.commercials.length) seq.push(Object.assign({ kind: 'commercial' }, pick(manifest.commercials, rng)));
      }
      if (manifest.structure && manifest.structure.identAfterBreak && manifest.idents.length) {
        seq.push(Object.assign({ kind: 'ident' }, pick(manifest.idents, rng)));
      }
    });
    return seq;
  }

  /* where in the loop is the channel right now? */
  function locate() {
    var dayStartMs = daySeed() * 86400000;
    var t = ((Date.now() - dayStartMs) / 1000) % totalDur;
    for (var i = 0; i < sequence.length; i++) {
      if (t < sequence[i].duration) return { index: i, offset: t };
      t -= sequence[i].duration;
    }
    return { index: 0, offset: 0 };
  }

  function nextProgramTitle(fromIndex) {
    for (var i = 1; i <= sequence.length; i++) {
      var item = sequence[(fromIndex + i) % sequence.length];
      if (item.kind === 'program') return item.title;
    }
    return '';
  }

  function labelFor(item) {
    if (item.kind === 'program') return item.title;
    if (item.kind === 'commercial') return 'Commercial break';
    return 'RHL now';
  }

  function tune(force) {
    /* day rolled over → rebuild */
    if (tune._seed !== daySeed()) {
      tune._seed = daySeed();
      sequence = buildSequence(tune._seed);
      totalDur = sequence.reduce(function (s, x) { return s + x.duration; }, 0);
      currentIndex = -1;
    }
    var pos = locate();
    var item = sequence[pos.index];
    if (dead[item.src]) { /* skip known-broken file by nudging forward on next tick */ }
    if (pos.index !== currentIndex || force) {
      currentIndex = pos.index;
      statusEl.textContent = '';
      if (tv.getAttribute('src') !== item.src) {
        tv.src = item.src;
        tv.addEventListener('loadedmetadata', function seekOnce() {
          tv.removeEventListener('loadedmetadata', seekOnce);
          var p = locate();
          tv.currentTime = Math.min(p.offset, Math.max(0, tv.duration - 0.5));
          tv.play().catch(function () {});
        });
      } else {
        tv.currentTime = pos.offset;
        tv.play().catch(function () {});
      }
      nowEl.textContent = 'Now — ' + labelFor(item);
      nextEl.textContent = 'Next — ' + nextProgramTitle(pos.index);
      document.title = 'RHL now — ' + labelFor(item);
    } else {
      /* drift correction: stay glued to the broadcast clock */
      if (tv.readyState >= 2 && Math.abs(tv.currentTime - pos.offset) > 6) {
        tv.currentTime = pos.offset;
      }
    }
  }

  function start() {
    document.getElementById('bug').src = manifest.watermark;
    document.getElementById('bug').hidden = false;
    tune(true);
    setInterval(tune, 4000);
    tv.addEventListener('ended', function () { tune(true); });
    tv.addEventListener('error', function () {
      if (tv.getAttribute('src')) dead[tv.getAttribute('src')] = true;
      statusEl.textContent = 'Signal interrupted — retuning…';
      setTimeout(function () { tune(true); }, 2000);
    });
  }

  fetch('/rhl-channel.json')
    .then(function (r) { return r.json(); })
    .then(function (m) { manifest = m; start(); })
    .catch(function () { statusEl.textContent = 'Channel offline'; });

  /* if autoplay was blocked, resume on any interaction or tab return */
  function ensurePlaying() { if (tv.paused && tv.readyState >= 2) tv.play().catch(function () {}); }
  document.addEventListener('click', ensurePlaying);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) ensurePlaying(); });
  tv.addEventListener('canplay', ensurePlaying);

  /* ---------- sound + fullscreen ---------- */
  function updateMuteUI() { unmuteBtn.classList.toggle('show', tv.muted); }
  tv.addEventListener('volumechange', updateMuteUI);
  tv.addEventListener('playing', updateMuteUI);
  unmuteBtn.addEventListener('click', function () { tv.muted = false; updateMuteUI(); });
  document.getElementById('fs').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });
  updateMuteUI();
})();
</script>
</body>
</html>
