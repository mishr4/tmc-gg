<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo card — New Update</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Fraunces';
    font-style: normal;
    font-weight: 300 700;
    src: url('/fonts/fraunces.ttf') format('truetype');
  }
  @font-face {
    font-family: 'Fraunces';
    font-style: italic;
    font-weight: 300 700;
    src: url('/fonts/fraunces-italic.ttf') format('truetype');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #08090b; }
  .card {
    position: relative;
    width: 1200px; height: 630px;
    background: #08090b;
    color: #fafafa;
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
    display: flex; flex-direction: column;
    padding: 56px 64px 52px;
  }
  /* huge dim liquid ampersand, background texture */
  .amp {
    position: absolute; right: -60px; top: -140px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144, "wght" 560;
    font-size: 820px; line-height: 1;
    color: rgba(255, 255, 255, 0.045);
    user-select: none; pointer-events: none;
  }
  .top {
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 1;
  }
  .brandline { display: flex; align-items: center; gap: 18px; }
  .brandline img { height: 34px; width: auto; display: block; }
  .brandline span {
    font-size: 13px; font-weight: 600; letter-spacing: 0.18em;
    text-transform: uppercase; color: #9a9ca2;
  }
  .stamp {
    font-size: 12px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: #80828a;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .stamp .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff3b33; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 1; }
  h1 {
    font-family: 'Fraunces', serif;
    font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144, "wght" 620;
    font-size: 176px; line-height: 0.96; letter-spacing: -0.03em;
    color: #fafafa;
  }
  h1 em {
    font-style: italic;
    font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144, "wght" 560;
  }
  .sub {
    margin-top: 30px; max-width: 640px;
    font-size: 21px; line-height: 1.5; color: #9a9ca2; font-weight: 400;
  }
  .bottom {
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    position: relative; z-index: 1;
  }
  .legal { font-size: 15px; color: #80828a; }
  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    background: #4c8dff; color: #08090b;
    font-weight: 600; font-size: 17px;
    padding: 15px 28px; border-radius: 13px;
    white-space: nowrap;
  }
  .cta .arr { font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
  <div class="card">
    <div class="amp">&amp;</div>
    <div class="top">
      <div class="brandline">
        <img src="/mavion-logo.png" alt="">
        <span>The Mavion Corporation</span>
      </div>
      <span class="stamp"><span class="dot"></span> Product update · 2026</span>
    </div>
    <div class="mid">
      <h1>New <em>Update</em></h1>
      <p class="sub">tmc.gg, rebuilt — a dark editorial home for the corporation, its companies, and everything we broadcast.</p>
    </div>
    <div class="bottom">
      <span class="legal">© 2026 The Mavion Corporation. All rights reserved.</span>
      <span class="cta">View on tmc.gg <span class="arr">→</span></span>
    </div>
  </div>
</body>
</html>
