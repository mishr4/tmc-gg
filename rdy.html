<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RDY</title>
<meta name="robots" content="noindex, nofollow">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  /* The Framer page is the OS — present it kiosk-style: the 1200x607 screen
     scaled to fill the display, letterboxed on black like a bezel. */
  #screen {
    position: fixed; top: 0; left: 0;
    width: 1200px; height: 607px;
    transform-origin: top left;
  }
  #screen iframe { width: 1200px; height: 607px; border: 0; display: block; background: #fff; }
  /* patch over Framer's bottom-right badge; scales with the screen */
  #badgeCover { position: absolute; right: 8px; bottom: 8px; width: 168px; height: 56px; background: #fff; }
  /* fullscreen toggle for kiosk setup — fades away, reappears on mouse move */
  #fs {
    position: fixed; right: 14px; bottom: 12px; z-index: 10;
    width: 34px; height: 34px; border: 1px solid rgba(255,255,255,.35); border-radius: 6px;
    background: rgba(0,0,0,.55); color: #fff; font-size: 16px; line-height: 1; cursor: pointer;
    opacity: 0; transition: opacity .25s;
  }
  #fs.show { opacity: 1; }
  :fullscreen #fs { display: none; }
</style>
</head>
<body>
<div id="screen">
  <iframe src="https://same-click-419588.framer.app/" title="Ready"></iframe>
  <div id="badgeCover"></div>
</div>
<button id="fs" title="Fullscreen">⛶</button>
<script>
(function () {
  var screenEl = document.getElementById('screen');
  function fit() {
    var s = Math.min(window.innerWidth / 1200, window.innerHeight / 607);
    if (!s || !isFinite(s)) { requestAnimationFrame(fit); return; }
    screenEl.style.transform = 'translate(' + Math.round((window.innerWidth - 1200 * s) / 2) + 'px,' +
                               Math.round((window.innerHeight - 607 * s) / 2) + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  fit();

  /* fullscreen button: visible on mouse move, hides after 2s idle */
  var fs = document.getElementById('fs'), hideTimer = null;
  fs.addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });
  window.addEventListener('mousemove', function () {
    fs.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { fs.classList.remove('show'); }, 2000);
  });
})();
</script>
</body>
</html>
