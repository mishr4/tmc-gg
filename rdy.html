<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDY</title>
<meta name="robots" content="noindex, nofollow">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  /* Fixed 1200x607 viewport for the embedded site, scaled to fit the window.
     The inner page always lays out at exactly 1200x607 regardless of screen size. */
  iframe {
    position: fixed; top: 0; left: 0; border: 0;
    width: 1200px; height: 607px;
    transform-origin: top left;
  }
</style>
</head>
<body>
<iframe src="https://same-click-419588.framer.app/" title="Ready"></iframe>
<script>
  (function () {
    var f = document.querySelector('iframe');
    function fit() {
      var s = Math.min(window.innerWidth / 1200, window.innerHeight / 607);
      if (!s || !isFinite(s)) { requestAnimationFrame(fit); return; }
      f.style.transform = 'translate(' + Math.round((window.innerWidth - 1200 * s) / 2) + 'px,' +
                          Math.round((window.innerHeight - 607 * s) / 2) + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    window.addEventListener('load', fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
    fit();
  })();
</script>
</body>
</html>
