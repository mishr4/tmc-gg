<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RBSC 2026 — Robloxse Broadcasting Singing Competition</title>
  <meta name="description" content="Vote for your favorite country in the RBSC 2026. Live performances and real-time voting.">
  <link rel="icon" href="/favicon-32.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a14;
      --card: #13131f;
      --border: rgba(255,255,255,0.06);
      --text: #fff;
      --muted: rgba(255,255,255,0.5);
      --accent: #7C4DFF;
      --pink: #FF48BC;
    }

    body {
      font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Nav */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 40px;
      background: rgba(10,10,18,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 18px;
    }

    .nav-menu {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-menu a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-menu a:hover,
    .nav-menu a.active {
      color: var(--text);
    }

    /* Hero */
    .hero {
      padding: 120px 40px 60px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: clamp(36px, 5vw, 64px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .hero h1 span { color: var(--accent); }

    .hero p {
      font-size: 17px;
      color: var(--muted);
      max-width: 480px;
      line-height: 1.6;
    }

    /* Grid */
    .grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .country-card {
      background: var(--card);
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      color: var(--text);
      text-decoration: none;
      position: relative;
      aspect-ratio: 1;
    }

    .country-card:hover {
      border-color: rgba(124,77,255,0.4);
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(124,77,255,0.15);
    }

    .country-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 0%, rgba(0,0,0,0.5) 100%);
      z-index: 1;
      transition: all 0.25s;
      pointer-events: none;
    }

    .country-card:hover::before {
      background: linear-gradient(135deg, transparent 0%, rgba(0,0,0,0.7) 100%);
    }

    .card-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: linear-gradient(135deg, var(--accent), var(--pink));
    }

    .card-video.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7C4DFF, #FF48BC, #0ED7FF, #7C4DFF);
      background-size: 400% 400%;
      animation: gradient-shift 12s ease infinite;
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-country {
      font-family: 'Axiforma', sans-serif;
      font-size: 24px;
      font-weight: 600;
      line-height: 1;
    }

    .card-artist {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.4;
    }

    .card-votes {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .card-votes-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .card-votes-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--pink));
      transition: width 0.5s ease;
    }

    .card-votes-number {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Voting Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-video {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-video video,
    .modal-video iframe {
      width: 100%;
      height: 100%;
    }

    .modal-info {
      padding: 32px 24px;
    }

    .modal-country {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-artist {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .vote-button {
      width: 100%;
      padding: 14px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .vote-button:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .vote-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: scale(1);
    }

    .vote-status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .vote-status.success {
      background: rgba(76,175,80,0.1);
      color: #4CAF50;
    }

    .vote-status.error {
      background: rgba(255,23,68,0.1);
      color: #FF1744;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 101;
    }

    /* Footer */
    .footer {
      background: rgba(10,10,18,0.5);
      border-top: 1px solid var(--border);
      padding: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .nav { padding: 14px 20px; }
      .nav-menu { display: none; }
      .hero { padding: 80px 20px 40px; }
      .grid { padding: 0 20px 60px; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/rbsc" class="nav-logo">🎤 RBSC 2026</a>
  <ul class="nav-menu">
    <li><a href="/rbsc" class="active">Vote</a></li>
    <li><a href="/rbsc#results">Results</a></li>
    <li><a href="/rbsc/admin" target="_blank">Admin Portal</a></li>
  </ul>
</nav>

<div class="hero">
  <h1>Vote for your favorite <span>performance</span></h1>
  <p>Watch performances from countries around the world and vote for your favorites. The competition ends at midnight UTC.</p>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div class="modal-content">
    <div class="modal-video" id="modal-video"></div>
    <div class="modal-info">
      <div class="modal-country" id="modal-country"></div>
      <div class="modal-artist" id="modal-artist"></div>
      <button class="vote-button" id="vote-btn" onclick="submitVote()">Vote for this performance</button>
      <div class="vote-status" id="vote-status" style="display:none"></div>
    </div>
  </div>
</div>

<div class="footer">
  <p>RBSC 2026 | Hosted by <a href="https://tmc.gg">The Mishra Corporation</a></p>
  <p style="margin-top: 12px; font-size: 12px;">🎙️ Powered by <a href="https://cirya.co">Cirya</a></p>
</div>

<script>
let currentCountryId = null;
let votes = {};

// Load countries and performances
async function init() {
  try {
    const res = await fetch('/api/rbsc/performances');
    const performances = await res.json();

    renderGrid(performances);

    // Load vote counts
    const votesRes = await fetch('/api/rbsc/votes');
    votes = await votesRes.json();
    updateVoteCounts();

    // Refresh votes every 5 seconds
    setInterval(async () => {
      const votesRes = await fetch('/api/rbsc/votes');
      votes = await votesRes.json();
      updateVoteCounts();
    }, 5000);
  } catch (e) {
    console.error('Failed to load performances:', e);
  }
}

function renderGrid(performances) {
  const grid = document.getElementById('grid');
  grid.innerHTML = performances.map(p => `
    <div class="country-card" onclick="openModal('${p.id}', '${p.country}', '${p.artist}', '${p.song}', '${p.videoUrl}')">
      ${p.videoUrl
        ? `<video class="card-video" src="${p.videoUrl}" muted></video>`
        : `<div class="card-video placeholder" style="color:rgba(255,255,255,0.5)">No video</div>`
      }
      <div class="card-content">
        <div class="card-country">${p.country}</div>
        <div class="card-artist">${p.artist} — ${p.song}</div>
        <div class="card-votes">
          <div class="card-votes-bar">
            <div class="card-votes-fill" id="votes-${p.id}" style="width:0%"></div>
          </div>
          <div class="card-votes-number" id="count-${p.id}">0</div>
        </div>
      </div>
    </div>
  `).join('');
}

function updateVoteCounts() {
  const total = Object.values(votes).reduce((a,b) => a+b, 0);
  Object.entries(votes).forEach(([id, count]) => {
    const pct = total > 0 ? Math.round((count / total) * 100) : 0;
    const fill = document.getElementById(`votes-${id}`);
    const counter = document.getElementById(`count-${id}`);
    if (fill) fill.style.width = pct + '%';
    if (counter) counter.textContent = count;
  });
}

function openModal(id, country, artist, song, videoUrl) {
  currentCountryId = id;
  document.getElementById('modal').classList.add('active');
  document.getElementById('modal-country').textContent = country;
  document.getElementById('modal-artist').textContent = `${artist} — ${song}`;
  document.getElementById('vote-status').style.display = 'none';
  document.getElementById('vote-btn').disabled = false;

  const videoEl = document.getElementById('modal-video');
  videoEl.innerHTML = '';
  if (videoUrl) {
    if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
      const id = new URL(videoUrl).searchParams.get('v') || videoUrl.split('/').pop();
      videoEl.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    } else {
      videoEl.innerHTML = `<video src="${videoUrl}" controls style="width:100%;height:100%"></video>`;
    }
  } else {
    videoEl.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.5)">No video available</div>';
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  currentCountryId = null;
}

async function submitVote() {
  const btn = document.getElementById('vote-btn');
  const status = document.getElementById('vote-status');

  btn.disabled = true;
  btn.textContent = 'Voting...';

  try {
    const res = await fetch('/api/rbsc/vote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ country_id: currentCountryId })
    });

    const result = await res.json();

    if (res.ok) {
      status.className = 'vote-status success';
      status.textContent = '✓ Vote submitted! Thank you for voting.';
      status.style.display = 'block';
      btn.textContent = 'Vote submitted';
      setTimeout(() => closeModal(), 2000);
    } else {
      status.className = 'vote-status error';
      status.textContent = result.error || 'Failed to submit vote';
      status.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Vote for this performance';
    }
  } catch (e) {
    status.className = 'vote-status error';
    status.textContent = 'Error: ' + e.message;
    status.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Vote for this performance';
  }
}

// Close modal on backdrop click
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

init();
</script>

</body>
</html>
