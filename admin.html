<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Staff Admin — TMC</title>
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#fef6f0;--bg2:#fdf2fd;--card:#fff;--shadow:0 1px 21px rgba(0,0,0,.07);--text:#0a0a14;--sub:#444;--muted:#777;--subtle:#aaa;--border:rgba(0,0,0,.07);--accent:#7C4DFF;--red:#E5484D;--green:#0a9d6c;--amber:#b06d00}
  html{-webkit-font-smoothing:antialiased;background:linear-gradient(90deg,var(--bg),var(--bg2))}
  body{font-family:'Instrument Sans','Inter',sans-serif;color:var(--text);line-height:1.5;min-height:100vh}
  .nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:rgba(254,246,240,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
  .nav-left{display:flex;align-items:center;gap:12px}
  .nav-left img{height:24px;width:auto}
  .nav-sub{font-family:'Lexend',sans-serif;font-size:13px;font-weight:600;color:var(--muted)}
  .nav-right{display:flex;gap:10px;align-items:center}
  .btn{padding:8px 16px;border-radius:10px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:all .15s}
  .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.9}
  .btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
  .btn-danger{background:transparent;border:1.5px solid rgba(229,72,77,.25);color:var(--red)}.btn-danger:hover{background:rgba(229,72,77,.06)}
  .btn-sm{padding:6px 11px;font-size:11px}
  main{max-width:1000px;margin:0 auto;padding:28px 32px 80px}
  h1{font-family:'Lexend',sans-serif;font-size:24px;font-weight:700;margin-bottom:4px}
  .lede{color:var(--muted);font-size:14px;margin-bottom:26px}
  .section{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:22px}
  .section h2{font-family:'Lexend',sans-serif;font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .addform{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)}
  .fg{display:flex;flex-direction:column;gap:5px}
  .fg label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--subtle)}
  .fg input,.fg select{padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:13px;color:var(--text);outline:none;background:#fff}
  .fg input:focus,.fg select:focus{border-color:var(--accent)}
  .fg.email{flex:1;min-width:200px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--subtle);padding:8px 10px;border-bottom:1px solid var(--border)}
  td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .pill.admin{background:rgba(124,77,255,.1);color:var(--accent)}
  .pill.staff{background:rgba(0,0,0,.05);color:var(--muted)}
  .pill.ok{background:rgba(16,185,129,.12);color:var(--green)}
  .pill.off{background:rgba(229,72,77,.1);color:var(--red)}
  .pill.temp{background:rgba(176,109,0,.12);color:var(--amber)}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);font-size:13px;padding:18px 4px}
  .log-action{font-weight:600}
  /* temp-password modal */
  .modal-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.3);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.25);max-width:440px;width:100%;padding:28px}
  .modal h3{font-family:'Lexend',sans-serif;font-size:18px;font-weight:700;margin-bottom:6px}
  .modal p{font-size:13px;color:var(--muted);margin-bottom:16px}
  .temp-box{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px dashed var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .temp-pw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;font-weight:700;letter-spacing:.03em;flex:1;word-break:break-all}
  .warn{font-size:12px;color:var(--amber);background:rgba(176,109,0,.08);border-radius:8px;padding:10px 12px;margin-bottom:16px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0a0a14;color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:300;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:640px){ main{padding:20px 16px 80px} .nav{padding:12px 16px} th:nth-child(4),td:nth-child(4){display:none} }
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-left"><img src="/mavion-logo.png" alt="TMC" onerror="this.style.display='none'"><span class="nav-sub">Staff Admin</span></div>
  <div class="nav-right">
    <a class="btn btn-outline btn-sm" href="/portal">Portal</a>
    <button class="btn btn-outline btn-sm" onclick="StaffAuth.logout()">Sign out</button>
  </div>
</nav>

<main>
  <h1>User management</h1>
  <p class="lede">Add staff by email, issue temporary passwords, and control access. All actions are logged.</p>

  <div class="section">
    <h2>Staff users <span id="user-count" class="muted" style="font-size:12px;font-weight:500"></span></h2>
    <form class="addform" id="add-form">
      <div class="fg email"><label>Email</label><input type="email" id="nu-email" placeholder="person@example.com" required></div>
      <div class="fg"><label>Name (optional)</label><input type="text" id="nu-name" placeholder="Full name"></div>
      <div class="fg"><label>Role</label><select id="nu-role"><option value="staff">Staff</option><option value="admin">Admin</option></select></div>
      <button class="btn btn-primary" type="submit">+ Add user</button>
    </form>
    <div id="users"><div class="empty">Loading…</div></div>
  </div>

  <div class="section">
    <h2>Activity log <button class="btn btn-outline btn-sm" onclick="loadAudit()">Refresh</button></h2>
    <div id="audit"><div class="empty">Loading…</div></div>
  </div>
</main>

<div class="modal-bg" id="temp-modal">
  <div class="modal">
    <h3>Temporary password</h3>
    <p>Share this with <b id="temp-email"></b> over a secure channel. They’ll be required to change it at first sign-in.</p>
    <div class="temp-box"><span class="temp-pw" id="temp-pw"></span><button class="btn btn-outline btn-sm" onclick="copyTemp()">Copy</button></div>
    <div class="warn" id="temp-warn"></div>
    <button class="btn btn-primary" style="width:100%" onclick="closeTemp()">Done</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/staff-auth.js"></script>
<script>
const $ = s => document.getElementById(s);
function esc(s){ if(s==null) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function fmt(t){ if(!t) return '—'; try{ return new Date(t).toLocaleString(); }catch{ return t; } }

async function adminCall(action, extra){
  const r = await fetch('/api/auth/admin', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({action}, extra||{})) });
  let d={}; try{ d=await r.json(); }catch{}
  if(!r.ok) throw new Error(d.error || ('Error '+r.status));
  return d;
}

async function loadUsers(){
  try{
    const { users } = await adminCall('list_users');
    $('user-count').textContent = users.length ? `· ${users.length}` : '';
    if(!users.length){ $('users').innerHTML='<div class="empty">No staff users yet. Add one above.</div>'; return; }
    $('users').innerHTML = `<table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Last login</th><th></th></tr></thead><tbody>${
      users.map(u=>{
        const status = u.disabled ? '<span class="pill off">Disabled</span>' : (u.must_change ? '<span class="pill temp">Temp pw</span>' : '<span class="pill ok">Active</span>');
        return `<tr>
          <td>${esc(u.email)}${u.name?`<div class="muted" style="font-size:11px">${esc(u.name)}</div>`:''}</td>
          <td><span class="pill ${u.role==='admin'?'admin':'staff'}">${esc(u.role)}</span></td>
          <td>${status}</td>
          <td class="muted">${fmt(u.last_login)}</td>
          <td><div class="row-actions">
            <button class="btn btn-outline btn-sm" onclick="resetPw('${esc(u.email)}')">Reset pw</button>
            <button class="btn btn-outline btn-sm" onclick="toggleDisabled('${esc(u.email)}',${u.disabled?'false':'true'})">${u.disabled?'Enable':'Disable'}</button>
            <button class="btn btn-danger btn-sm" onclick="removeUser('${esc(u.email)}')">Remove</button>
          </div></td>
        </tr>`;
      }).join('')
    }</tbody></table>`;
  }catch(e){ $('users').innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}

async function loadAudit(){
  try{
    const { logs } = await adminCall('list_audit', { limit: 60 });
    if(!logs.length){ $('audit').innerHTML='<div class="empty">No activity yet.</div>'; return; }
    $('audit').innerHTML = `<table><thead><tr><th>When</th><th>Action</th><th>Actor</th><th>Target</th><th>IP</th></tr></thead><tbody>${
      logs.map(l=>`<tr><td class="muted">${fmt(l.at)}</td><td class="log-action">${esc(l.action)}</td><td>${esc(l.actor||'—')}</td><td>${esc(l.target||'—')}</td><td class="muted">${esc(l.ip||'—')}</td></tr>`).join('')
    }</tbody></table>`;
  }catch(e){ $('audit').innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}

let lastTemp = '';
function showTemp(email, temp, hours){
  $('temp-email').textContent = email;
  $('temp-pw').textContent = temp; lastTemp = temp;
  $('temp-warn').textContent = `This password is shown only once and expires in ${hours} hours (or after first sign-in).`;
  $('temp-modal').classList.add('show');
}
function closeTemp(){ $('temp-modal').classList.remove('show'); loadUsers(); loadAudit(); }
function copyTemp(){ navigator.clipboard.writeText(lastTemp).then(()=>toast('Copied')); }

$('add-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email=$('nu-email').value.trim(), name=$('nu-name').value.trim(), role=$('nu-role').value;
  if(!email) return;
  const btn=e.target.querySelector('button'); btn.disabled=true;
  try{ const d=await adminCall('add_user',{email,name,role}); $('nu-email').value=''; $('nu-name').value=''; showTemp(d.email, d.tempPassword, d.expiresHours); }
  catch(err){ toast(err.message); } finally{ btn.disabled=false; }
});
async function resetPw(email){ if(!confirm('Issue a new temporary password for '+email+'?')) return; try{ const d=await adminCall('reset_password',{email}); showTemp(d.email,d.tempPassword,d.expiresHours); }catch(e){ toast(e.message); } }
async function toggleDisabled(email,disabled){ try{ await adminCall('set_disabled',{email,disabled}); toast(disabled?'User disabled':'User enabled'); loadUsers(); loadAudit(); }catch(e){ toast(e.message); } }
async function removeUser(email){ if(!confirm('Permanently remove '+email+'? This cannot be undone.')) return; try{ await adminCall('remove_user',{email}); toast('User removed'); loadUsers(); loadAudit(); }catch(e){ toast(e.message); } }

StaffAuth.guard({ adminOnly:true, onReady(){ loadUsers(); loadAudit(); } });
</script>
</body>
</html>
